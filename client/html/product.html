<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto | Luddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style/tokens.css">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/components.css">
    <link rel="stylesheet" href="../style/layout.css">
    <link rel="stylesheet" href="../style/luddees.css?v=visual-v33">
    <link rel="stylesheet" href="../style/responsive.css?v=qa-v1">
    <link rel="stylesheet" href="../style/components/catalog-cart.css?v=cart-feedback-v1">
    <link rel="stylesheet" href="../style/pages/product.css?v=product-v3">
    <script src="../js/luddies-storage-keys.js"></script>
    <script src="../js/catalog-seed.js?v=catalog-v2"></script>
    <script src="../js/config.js?v=api-mode-v2"></script>
    <script src="../js/luddies-api.js"></script>
    <script src="../js/money.js"></script>
    <script src="../js/catalog-api-mapper.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js?v=public-product-v1"></script>
</head>
<body class="page-product" data-site-page="catalog">
    <header id="site-header"></header>

    <main>
        <section class="product-stage" id="product-stage" hidden>
            <div class="container product-stage__container">
                <a class="product-back" href="catalog.html#destacados">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                    <span data-i18n="product_back_catalog"></span>
                </a>
                <div class="product-showcase fade-in">
                    <div class="product-showcase__art">
                        <span id="product-availability" class="product-showcase__badge" data-i18n="cat_prod_badge_consult"></span>
                        <img class="product-showcase__backdrop" id="product-image-backdrop" src="" alt="" aria-hidden="true">
                        <img id="product-image" src="" alt="" width="1024" height="1024">
                    </div>
                    <div class="product-showcase__copy">
                        <p class="product-eyebrow" data-i18n="product_detail_eyebrow"></p>
                        <p class="product-meta" id="product-meta"></p>
                        <h1 class="product-title" id="product-title"></h1>
                        <p class="product-description" id="product-description"></p>
                        <div class="product-categories" id="product-categories" aria-label="Áreas"></div>
                        <p class="product-price" id="product-price"></p>
                        <div class="product-actions">
                            <button type="button" class="btn btn-luddies btn-luddies--primary js-catalog-acquire" id="product-acquire"></button>
                            <a class="btn btn-luddies btn-luddies--outline" href="contact.html" data-i18n="product_support_cta"></a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="product-not-found" id="product-not-found" hidden>
            <div class="container">
                <div class="product-not-found__card">
                    <span aria-hidden="true"><i class="fa-solid fa-folder-open"></i></span>
                    <h1 data-i18n="product_not_found_title"></h1>
                    <p data-i18n="product_not_found_copy"></p>
                    <a class="btn btn-luddies btn-luddies--primary" href="catalog.html" data-i18n="product_not_found_action"></a>
                </div>
            </div>
        </section>

        <section class="page-section product-details" id="product-details" hidden>
            <div class="container">
                <div class="product-details__grid">
                    <article class="product-detail-card product-detail-card--wide">
                        <p class="product-detail-card__kicker">01</p>
                        <h2 data-i18n="product_includes_title"></h2>
                        <p data-i18n="product_includes_copy"></p>
                        <ul class="product-includes-list">
                            <li data-i18n="product_include_1"></li>
                            <li data-i18n="product_include_2"></li>
                            <li data-i18n="product_include_3"></li>
                            <li data-i18n="product_include_4"></li>
                        </ul>
                    </article>
                    <article class="product-detail-card product-detail-card--accent">
                        <p class="product-detail-card__kicker">02</p>
                        <h2 data-i18n="product_fit_title"></h2>
                        <p data-i18n="product_fit_copy"></p>
                        <div class="product-detail-object" aria-hidden="true">
                            <span></span><span></span><span></span>
                        </div>
                    </article>
                    <article class="product-detail-card product-detail-card--support">
                        <div class="product-support__copy">
                            <p class="product-detail-card__kicker">03</p>
                            <h2 data-i18n="product_support_title"></h2>
                            <p data-i18n="product_support_copy"></p>
                            <a href="contact.html" class="product-inline-link" data-i18n="product_support_cta"></a>
                        </div>
                        <picture class="product-support__render" aria-hidden="true">
                            <source srcset="../images/luddees/identity-v2/product/product-support-customize-v1.webp" type="image/webp">
                            <img src="../images/luddees/identity-v2/product/product-support-customize-v1.png" width="1536" height="1024" alt="">
                        </picture>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="footer-lite"></footer>

    <div id="catalog-cart-toast" class="catalog-cart-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
        <span class="catalog-cart-toast__icon" aria-hidden="true"><i class="fa-solid fa-circle-check"></i></span>
        <div class="catalog-cart-toast__body">
            <p class="catalog-cart-toast__msg" id="catalog-cart-toast-msg"></p>
            <a class="catalog-cart-toast__link" href="checkout.html" data-i18n="cat_cart_review"></a>
        </div>
        <button type="button" class="catalog-cart-toast__close" id="catalog-cart-toast-close">
            <span aria-hidden="true">&times;</span><span class="visually-hidden" data-i18n="cat_cart_toast_close"></span>
        </button>
    </div>
    <div class="catalog-cart-bar" id="catalog-cart-bar" hidden>
        <span class="catalog-cart-bar-text" id="catalog-cart-bar-text" aria-live="polite"></span>
        <a class="btn btn-sm btn-luddies btn-luddies--secondary" href="checkout.html" data-i18n="cat_cart_review"></a>
        <button type="button" class="btn btn-sm btn-luddies btn-luddies--outline" id="catalog-cart-clear" data-i18n="cat_cart_clear"></button>
    </div>
    <p class="sr-only-visually-hidden" id="catalog-cart-live" aria-live="assertive"></p>

    <script src="../js/layout.js?v=nav-stability-v1"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script defer src="../js/i18n.js?v=product-v1"></script>
    <script defer src="../js/brand-assets.js?v=visual-v9"></script>
    <script defer src="../js/auth-ui.js?v=nav-login-v2"></script>
    <script defer src="../js/product-detail.js?v=product-v2"></script>
    <script defer src="../js/catalog-cart.js?v=cart-feedback-v1"></script>
    <script defer src="../js/fade-in.js"></script>
</body>
</html>
