<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Luddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style/tokens.css">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/components.css">
    <link rel="stylesheet" href="../style/pages/auth.css?v=auth-v9">
    <link rel="stylesheet" href="../style/luddees.css?v=visual-v30">
    <link rel="stylesheet" href="../style/responsive.css?v=qa-v1">
    <script src="../js/luddies-storage-keys.js"></script>
    <script src="../js/catalog-seed.js"></script>
    <script src="../js/config.js?v=api-mode-v2"></script>
    <script src="../js/luddies-api.js"></script>
    <script src="../js/money.js"></script>
    <script src="../js/catalog-api-mapper.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/brand-assets.js?v=visual-v9"></script>
</head>
<body class="page-auth">
    <header class="page-auth__hero">
        <div class="container">
            <div class="page-auth__brand">
                <a href="index.html" class="page-auth__brand-link" data-i18n-aria="nav_home">
                    <img data-luddies-brand-logo src="../images/luddees/identity-v2/brand/luddies-mark-white.svg" width="56" height="56" alt="" data-i18n="logo_alt">
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow-1">
        <div class="container">
            <div class="page-auth__scene">
                <picture class="page-auth__characters" aria-hidden="true">
                    <source srcset="../images/luddees/identity-v2/auth/auth-welcome-peek-v1.webp" type="image/webp">
                    <img src="../images/luddees/identity-v2/auth/auth-welcome-peek-v1.png" alt="" width="1536" height="1024">
                </picture>
                <div class="page-auth__card">
                <h1 class="page-auth__title" data-i18n="auth_login_title">Sign in</h1>
                <p class="page-auth__lead" data-i18n="auth_login_lead">Use your Luddies account.</p>

                <div class="alert alert-success d-none" id="login-success-alert" role="status"></div>
                <div class="alert alert-danger d-none" id="login-error-alert" role="alert"></div>

                <form id="login-form" novalidate>
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="login-email" name="email" placeholder="name@example.com" autocomplete="username" required>
                        <label for="login-email" data-i18n="auth_label_email">Email</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="login-password" name="password" placeholder="Password" autocomplete="current-password" required>
                        <label for="login-password" data-i18n="auth_label_password">Password</label>
                    </div>
                    <button type="submit" class="btn btn-luddies btn-luddies--primary w-100" data-i18n="auth_btn_signin">Sign in</button>
                </form>

                    <p class="page-auth__footer">
                        <span data-i18n="auth_no_account">No account yet?</span>
                        <a href="register.html" data-i18n="auth_link_register">Create one</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/auth-page.js"></script>
</body>
</html>
