<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra | Luddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style/tokens.css">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/components.css">
    <link rel="stylesheet" href="../style/layout.css">
    <link rel="stylesheet" href="../style/pages/contact.css">
    <link rel="stylesheet" href="../style/pages/checkout.css?v=checkout-v6">
    <link rel="stylesheet" href="../style/luddees.css?v=visual-v37">
    <link rel="stylesheet" href="../style/responsive.css?v=qa-v1">
    <script src="../js/luddies-storage-keys.js"></script>
    <script src="../js/catalog-seed.js"></script>
    <script src="../js/config.js?v=api-mode-v2"></script>
    <script src="../js/luddies-api.js"></script>
    <script src="../js/money.js"></script>
    <script src="../js/catalog-api-mapper.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js"></script>
</head>
<body class="page-checkout" data-site-page="checkout">
    <header id="site-header"></header>

    <main>
        <section class="hero-about checkout-hero">
            <div class="container checkout-hero__stage">
                    <div class="checkout-hero__copy fade-in">
                        <span class="checkout-hero__eyebrow" aria-hidden="true"><i class="fa-solid fa-basket-shopping"></i></span>
                        <h1 class="hero-title mb-3" data-i18n="checkout_hero_title"></h1>
                        <p class="hero-lead mb-0" data-i18n="checkout_hero_lead"></p>
                    </div>
                    <picture class="checkout-hero__render fade-in" aria-hidden="true">
                        <source srcset="../images/luddees/identity-v2/cta/catalog-publisher-lumo-v1.webp" type="image/webp">
                        <img src="../images/luddees/identity-v2/cta/catalog-publisher-lumo-v1.png" width="1536" height="2048" alt="">
                    </picture>
            </div>
        </section>

        <section class="page-section pt-0" id="checkout-body">
            <div class="container checkout-body-inner">
                <div class="checkout-empty" id="checkout-empty-state">
                    <div class="checkout-empty__copy">
                        <div class="checkout-empty__icon" aria-hidden="true"><i class="fa-solid fa-basket-shopping"></i></div>
                        <span class="checkout-empty__eyebrow" data-i18n="checkout_empty_eyebrow"></span>
                        <h2 data-i18n="checkout_empty_title"></h2>
                        <p data-i18n="checkout_cart_empty"></p>
                        <a class="btn btn-luddies btn-luddies--primary" href="catalog.html"><span data-i18n="checkout_back_catalog"></span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
                    </div>
                    <div class="checkout-empty__art" aria-hidden="true">
                        <picture class="checkout-empty__render">
                            <source srcset="../images/luddees/identity-v2/checkout/empty-cart-lumo-v1.webp" type="image/webp">
                            <img src="../images/luddees/identity-v2/checkout/empty-cart-lumo-v1.png" width="1536" height="1024" alt="">
                        </picture>
                    </div>
                </div>

                <div class="checkout-flow" id="checkout-main-flow" hidden>
                    <div class="checkout-workspace">
                        <div class="checkout-workspace__intro">
                            <div>
                                <span class="checkout-workspace__eyebrow" data-i18n="checkout_workspace_eyebrow"></span>
                                <h2 data-i18n="checkout_workspace_title"></h2>
                                <p data-i18n="checkout_workspace_copy"></p>
                            </div>
                            <ol class="checkout-progress" aria-label="Progreso de compra" data-i18n-aria="checkout_progress_label">
                                <li class="is-active"><span>1</span><strong data-i18n="checkout_step_details"></strong></li>
                                <li><span>2</span><strong data-i18n="checkout_step_review"></strong></li>
                                <li><span>3</span><strong data-i18n="checkout_step_payment"></strong></li>
                            </ol>
                        </div>
                        <div class="row g-4 g-xl-5 align-items-start checkout-workspace__grid">
                            <div class="col-12 col-lg-5 order-2 order-lg-2">
                            <aside class="checkout-panel checkout-panel--cart" aria-labelledby="checkout-cart-heading">
                                <div class="checkout-panel__heading">
                                    <span class="checkout-panel__number">02</span>
                                    <div>
                                        <h2 class="checkout-panel__title" id="checkout-cart-heading" data-i18n="checkout_section_cart"></h2>
                                        <p data-i18n="checkout_cart_intro"></p>
                                    </div>
                                </div>
                                <p class="checkout-cart-meta" id="checkout-cart-count" aria-live="polite"></p>
                                <ul class="checkout-lines" id="checkout-cart-lines"></ul>
                                <nav class="checkout-cart-pagination" id="checkout-cart-pagination" aria-label="Páginas del carrito" data-i18n-aria="checkout_cart_pagination_label" hidden></nav>
                                <div class="checkout-cart-total" id="checkout-cart-total-row" hidden>
                                    <span class="checkout-cart-total__label" data-i18n="checkout_total_label"></span>
                                    <strong class="checkout-cart-total__value" id="checkout-cart-total-value"></strong>
                                </div>
                                <p class="checkout-note" data-i18n="checkout_subtotal_note"></p>
                                <div class="d-flex gap-2 mt-2">
                                <a class="btn btn-sm btn-luddies btn-luddies--outline flex-grow-1" href="catalog.html" data-i18n="checkout_back_catalog"></a>
                                <button type="button" class="btn btn-sm btn-luddies btn-luddies--outline flex-grow-1" id="checkout-clear-cart" data-i18n="checkout_clear_cart"></button>
                                </div>
                            </aside>
                            </div>
                            <div class="col-12 col-lg-7 order-1 order-lg-1">
                            <div class="checkout-panel checkout-payment">
                                <div class="checkout-panel__heading">
                                    <span class="checkout-panel__number">01</span>
                                    <div>
                                        <h2 class="checkout-panel__title" id="checkout-payment-heading" data-i18n="checkout_section_payment"></h2>
                                        <p data-i18n="checkout_payment_intro"></p>
                                    </div>
                                </div>
                                <form id="checkout-payment-form" novalidate>
                                    <div class="checkout-field">
                                        <span class="checkout-field__icon" aria-hidden="true"><i class="fa-solid fa-paper-plane"></i></span>
                                        <div class="checkout-field__body">
                                        <label class="form-label-luddies" for="checkoutCorreo">
                                            <span data-i18n="checkout_email"></span> <span class="text-danger">*</span>
                                        </label>
                                        <input type="email" class="form-control-luddies w-100" id="checkoutCorreo" name="checkoutCorreo"
                                            data-i18n-placeholder="ph_checkout_email" placeholder=""
                                            autocomplete="email" required aria-describedby="errorCheckoutCorreo">
                                        <p class="error-msg" id="errorCheckoutCorreo" role="alert">
                                            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                                            <span id="errorCheckoutCorreoText"></span>
                                        </p>
                                        <p class="checkout-email-help mb-0" data-i18n="checkout_email_help"></p>
                                        </div>
                                    </div>
                                    <div class="checkout-field">
                                        <span class="checkout-field__icon checkout-field__icon--rose" aria-hidden="true"><i class="fa-solid fa-signature"></i></span>
                                        <div class="checkout-field__body">
                                        <label class="form-label-luddies" for="checkoutNombre">
                                            <span data-i18n="checkout_name_optional"></span>
                                        </label>
                                        <input type="text" class="form-control-luddies w-100" id="checkoutNombre" name="checkoutNombre"
                                            data-i18n-placeholder="ph_checkout_name_optional" placeholder=""
                                            autocomplete="name" minlength="2" maxlength="60"
                                            pattern="^[a-zA-ZáéíóúÁÉÍÓÚüÜñÑ\s'\-]+$"
                                            aria-describedby="errorCheckoutNombre">
                                        <p class="error-msg" id="errorCheckoutNombre" role="alert">
                                            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                                            <span id="errorCheckoutNombreText"></span>
                                        </p>
                                        </div>
                                    </div>
                                </form>
                                <div class="checkout-assurances" aria-label="Detalles del servicio" data-i18n-aria="checkout_assurances_label">
                                    <div><i class="fa-solid fa-bolt" aria-hidden="true"></i><span data-i18n="checkout_assurance_delivery"></span></div>
                                    <div><i class="fa-solid fa-shield-heart" aria-hidden="true"></i><span data-i18n="checkout_assurance_secure"></span></div>
                                    <div><i class="fa-solid fa-headset" aria-hidden="true"></i><span data-i18n="checkout_assurance_support"></span></div>
                                </div>
                                <p class="checkout-disclaimer"><i class="fa-brands fa-stripe" aria-hidden="true"></i><span data-i18n="checkout_disclaimer"></span></p>
                                <div class="checkout-actions">
                                    <button type="submit" form="checkout-payment-form" class="btn btn-luddies btn-luddies--primary" id="checkout-submit-purchase"><span data-i18n="checkout_cta_purchase"></span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
                                </div>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="footer-lite"></footer>

    <script src="../js/layout.js?v=nav-stability-v1"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script defer src="../js/i18n.js?v=checkout-empty-v1"></script>
    <script defer src="../js/brand-assets.js?v=visual-v9"></script>
    <script defer src="../js/auth-ui.js?v=nav-login-v2"></script>
    <script defer src="../js/fade-in.js"></script>
    <script defer src="../js/catalog-cart.js"></script>
    <script defer src="../js/checkout.js?v=checkout-v4"></script>
</body>
</html>
