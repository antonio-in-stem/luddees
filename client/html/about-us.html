<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | Luddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style/tokens.css">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/components.css">
    <link rel="stylesheet" href="../style/layout.css">
    <link rel="stylesheet" href="../style/pages/about.css?v=team-wall-v7">
    <link rel="stylesheet" href="../style/luddees.css?v=visual-v33">
    <link rel="stylesheet" href="../style/responsive.css?v=qa-v1">
    <script src="../js/luddies-storage-keys.js"></script>
    <script src="../js/catalog-seed.js"></script>
    <script src="../js/config.js?v=api-mode-v2"></script>
    <script src="../js/luddies-api.js"></script>
    <script src="../js/money.js"></script>
    <script src="../js/catalog-api-mapper.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js"></script>
</head>
<body data-site-page="about">
    <header id="site-header"></header>

    <main>

        <section class="hero-about about-hero">
            <div class="container">
                <div class="row align-items-center g-4">
                    <div class="col-12 col-lg-6 fade-in">
                        <h1 class="hero-title mb-3" data-i18n="hero_title"></h1>
                        <p class="hero-lead mb-4" data-i18n="hero_lead"></p>
                        <a class="btn btn-lg btn-luddies btn-luddies--primary px-4 py-2" href="#team" data-i18n="hero_cta"></a>
                    </div>
                    <div class="col-12 col-lg-6 fade-in">
                        <div class="hero-image-wrap about-hero-image">
                            <img src="../images/luddees/identity-v2/about/about-team-bridge-v2.webp" alt="" data-i18n="hero_image_alt" width="1536" height="1024">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="page-section pt-0 about-purpose-section">
            <div class="container">
                <div class="about-purpose-intro text-center fade-in">
                        <h2 class="section-title" data-i18n="who_title"></h2>
                        <p class="section-subtitle" data-i18n="who_desc"></p>
                </div>
            </div>

            <div class="purpose-stage fade-in">
                <picture class="purpose-stage__render" aria-hidden="true">
                    <source srcset="../images/luddees/identity-v2/about/purpose-path-v1.webp" type="image/webp">
                    <img src="../images/luddees/identity-v2/about/purpose-path-v1.png" alt="" width="2048" height="768">
                </picture>
                <div class="purpose-stage__copy">
                    <article class="purpose-statement purpose-statement--mission">
                        <span class="purpose-statement__index" aria-hidden="true">01</span>
                        <h3 data-i18n="mission_title"></h3>
                        <p data-i18n="mission_desc"></p>
                        <div class="purpose-statement__render purpose-statement__render--mission" aria-hidden="true"></div>
                    </article>
                    <article class="purpose-statement purpose-statement--vision">
                        <span class="purpose-statement__index" aria-hidden="true">02</span>
                        <h3 data-i18n="vision_title"></h3>
                        <p data-i18n="vision_desc"></p>
                        <div class="purpose-statement__render purpose-statement__render--vision" aria-hidden="true"></div>
                    </article>
                </div>
            </div>
        </section>

        <section class="about-values-section">
            <div class="container">
                <div class="about-values-intro text-center fade-in">
                    <h2 class="section-title mb-2" data-i18n="values_title"></h2>
                    <p class="section-subtitle" data-i18n="values_subtitle"></p>
                </div>

                <picture class="values-workbench fade-in" aria-hidden="true">
                    <source srcset="../images/luddees/identity-v2/about/values-workbench-v1.webp" type="image/webp">
                    <img src="../images/luddees/identity-v2/about/values-workbench-v1.png" alt="" width="1942" height="809">
                </picture>

                <div class="values-story-grid">
                    <article class="value-story fade-in">
                        <div class="value-story__render value-story__render--innovation" aria-hidden="true"></div>
                        <span class="value-story__number" aria-hidden="true">01</span>
                        <h3 data-i18n="val_inno_title"></h3>
                        <p data-i18n="val_inno_desc"></p>
                    </article>
                    <article class="value-story fade-in">
                        <div class="value-story__render value-story__render--inclusion" aria-hidden="true"></div>
                        <span class="value-story__number" aria-hidden="true">02</span>
                        <h3 data-i18n="val_inclu_title"></h3>
                        <p data-i18n="val_inclu_desc"></p>
                    </article>
                    <article class="value-story fade-in">
                        <div class="value-story__render value-story__render--excellence" aria-hidden="true"></div>
                        <span class="value-story__number" aria-hidden="true">03</span>
                        <h3 data-i18n="val_excel_title"></h3>
                        <p data-i18n="val_excel_desc"></p>
                    </article>
                </div>
            </div>
        </section>

        <section class="page-section team-section" id="team">
            <div class="container">
                <div class="team-room">
                    <div class="text-center team-section__intro fade-in">
                        <h2 class="section-title mb-2" data-i18n="team_title"></h2>
                        <p class="section-subtitle mb-0" data-i18n="team_subtitle"></p>
                    </div>
                    <div class="team-room__picture-rail" aria-hidden="true"></div>
                    <div id="team-gallery" class="team-gallery" role="list"></div>
                    <img class="team-room__luddie team-room__luddie--album"
                        src="../images/luddees/identity-v2/hero/home-portfolio-breakout-v2.webp" alt=""
                        aria-hidden="true">
                    <img class="team-room__luddie team-room__luddie--runner"
                        src="../images/luddees/identity-v2/cta/creator-miga-v1.webp" alt=""
                        aria-hidden="true">
                    <div class="team-room__console" aria-hidden="true">
                        <span class="team-room__books"></span>
                        <span class="team-room__vase"></span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="footer-lite"></footer>

    <script src="../js/layout.js?v=nav-stability-v1"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script defer src="../js/i18n.js"></script>
    <script defer src="../js/brand-assets.js?v=visual-v9"></script>
    <script defer src="../js/auth-ui.js?v=nav-login-v2"></script>
    <script defer src="../js/fade-in.js"></script>
    <script defer src="../js/about-team.js?v=team-room-v2"></script>
</body>
</html>
